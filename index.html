<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 分割版の CSP。build.mjs が単一HTML版用（すべてインライン、connect-src 'none'）に差し替える -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Diff</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PDF Diff <small style="color:var(--mut);font-weight:normal">— オフライン動作・ファイルは外部に送信されません</small><a class="dl" href="diff-pdf.html" download data-build="remove" title="ダブルクリックで開ける単一ファイル版">単一HTML版をダウンロード</a></h1>
  <div class="files">
    <div class="drop a" id="dropA"><b>A</b><span>旧PDFをドロップ / クリック</span><input type="file" accept="application/pdf" hidden></div>
    <div class="drop b" id="dropB"><b>B</b><span>新PDFをドロップ / クリック</span><input type="file" accept="application/pdf" hidden></div>
  </div>
  <div class="bar">
    <div class="tabs"><button data-v="text" class="on">テキスト差分</button><button data-v="visual">見た目の差分</button></div>
    <span id="textOpts">
      <label title="英数字の単語の間の空白は区切りとして残す"><input type="checkbox" id="optWs" checked>空白の違いを無視</label>
      <label><input type="checkbox" id="optNfkc" checked>全角/半角を同一視</label>
      <label><input type="checkbox" id="optCase">大小文字を無視</label>
      <label><input type="checkbox" id="optJoin">行を連結して比較</label>
      <label title="文字の位置から段組みを判定し、段ごとに上から読む"><input type="checkbox" id="optCols" checked>段組みを考慮</label>
      <label><input type="checkbox" id="optOnly" checked>変更箇所のみ</label>
      <button class="btn" id="prev">▲ 前</button><button class="btn" id="next">▼ 次</button>
    </span>
    <span id="status">PDFを2つ選んでください</span>
  </div>
</header>
<main>
  <section class="view on" id="v-text"><div class="empty-msg">AとBにPDFを読み込むと差分が表示されます</div></section>
  <section class="view" id="v-visual">
    <div class="vctl">
      <span>A ページ <input type="number" id="pgA" min="1" value="1"></span>
      <span>B ページ <input type="number" id="pgB" min="1" value="1"></span>
      <button class="btn" id="pgPrev">← 前</button><button class="btn" id="pgNext">次 →</button>
      <label title="テキスト差分の結果から、A と B のページを対応付ける（ページの挿入・削除に追従）"><input type="checkbox" id="optAuto" checked>ページを自動対応</label>
      <label title="行の挿入・削除によるページ内の上下のずれを補正して比べる"><input type="checkbox" id="optShift" checked>ずれを補正</label>
      <label>表示 <select id="vmode"><option value="3">A / B / 差分</option><option value="1">差分のみ</option></select></label>
      <label>感度 <input type="range" id="thr" min="4" max="120" value="32"></label>
      <button class="btn" id="scanAll">全ページを走査</button>
      <span id="vinfo" style="color:var(--mut)"></span>
    </div>
    <div id="pageList"></div>
    <div class="canv" id="canv">
      <figure><figcaption>A</figcaption><canvas id="cA"></canvas></figure>
      <figure><figcaption>B</figcaption><canvas id="cB"></canvas></figure>
      <figure><figcaption>差分 <span style="color:#d14343">■ Aのみ</span> <span style="color:#2e9b5a">■ Bのみ</span></figcaption><canvas id="cD"></canvas></figure>
    </div>
  </section>
</main>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="diff.js"></script>
<script src="layout.js"></script>
<script src="visual.js"></script>
<script src="app.js"></script>
</body>
</html>
